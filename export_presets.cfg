; iOS. Exports an Xcode project rather than a finished app — Godot never builds
; the binary itself on this platform, so `include_filter` matters here for
; exactly the same reason it does above, and nothing downstream would catch it:
; there is no headless iOS build to boot and grep for the dictionary.
;
; `application/min_ios_version` is 14.0 because that is what the 4.7 export
; templates are built against; setting it lower does not make them run lower.
;
; `export_project_only=true` so the export is a plain file-writing step with no
; compiler in it. That is what lets it run — and be checked — from Linux; the
; macOS runner then builds the emitted project itself, which is also the only
; way to pass the unsigned build flags.
;
; The team ID is the free-provisioning one this Apple ID already carries. The
; build ships unsigned and is re-signed at install time, so this is a field
; Godot refuses to leave blank rather than a signing decision.
;
; The version fields, by contrast, are blank on purpose: left empty they inherit
; `config/version` from project.godot, and a second copy of the version number
; is a second thing to forget on release day.

[preset.3]

name="iOS"
platform="iOS"
runnable=false
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="data/*.txt"
exclude_filter=""
export_path="build/ios/WordWars.ipa"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.3.options]

application/app_store_team_id="226Y8RZFKG"
application/bundle_identifier="com.damonj.wordwars"
application/signature=""
application/short_version=""
application/version=""
application/min_ios_version="14.0"
; A Godot enum index, not a UIDeviceFamily value — 0 iPhone, 1 iPad, 2 both.
; Read as the latter it looks like it says iPhone while writing UIDeviceFamily
; [2], and the install fails at the device with "DeviceFamilyNotSupported".
; Both, because the game is portrait and an iPad in portrait is fine.
application/targeted_device_family=2
application/icon_interpolation=4
application/export_project_only=true
capabilities/access_wifi=false
capabilities/push_notifications=false
; The launch storyboard is the first thing on screen — iOS shows it from the
; moment the icon is tapped until the app draws its first frame, before any of
; the engine has run. So it is a separate thing from `boot_splash` and both need
; the art, or the portrait splash appears a beat after a landscape one.
;
; "Scale to Fit" (2) rather than "Scale to Fill" (3). The art is 1:2.16, which is
; within a pixel or two of every modern phone but nothing like a 1:1.78 SE — fill
; would crop a fifth of the height off that screen, taking the loading bar with
; it. Fit leaves bands instead, and the bands are the same near-black the art
; already fades to at both ends.
storyboard/use_custom_bg_color=true
storyboard/custom_bg_color=Color(0.003922, 0.023529, 0.101961, 1)
storyboard/image_scale_mode=2
storyboard/custom_image@2x="res://iosSplashScreen.png"
storyboard/custom_image@3x="res://iosSplashScreen.png"
