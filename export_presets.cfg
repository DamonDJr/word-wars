; Export presets for Word Wars.
;
; Two things here are load-bearing:
;
;   include_filter  — data/*.txt are plain text, not imported resources, so Godot
;                     leaves them out unless they are named explicitly. Without
;                     this the build starts and then has no dictionary at all.
;   embed_pck       — bundles everything into the executable, so each platform is
;                     a single file to hand someone rather than an exe plus a pck
;                     they have to keep next to it.

[preset.0]

name="Linux"
platform="Linux"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="data/*.txt"
exclude_filter=""
export_path="build/linux/WordWars.x86_64"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=0
binary_format/embed_pck=true
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
ssh_remote_deploy/enabled=false

[preset.1]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="data/*.txt"
exclude_filter=""
export_path="build/windows/WordWars.exe"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.1.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=0
binary_format/embed_pck=true
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
codesign/enable=false
application/modify_resources=false
application/icon=""
application/console_wrapper_icon=""
application/icon_interpolation=4
application/file_version="0.14.0.0"
application/product_version="0.14.0.0"
application/company_name="damonj"
application/product_name="Word Wars"
application/file_description="Word Wars — a typing duel"
application/copyright=""
application/trademarks=""
application/export_angle=0
application/export_d3d12=0
ssh_remote_deploy/enabled=false

# iOS. Exports an Xcode project rather than a finished app — Godot never builds
# the binary itself on this platform, so `include_filter` matters here for
# exactly the same reason it does above, and nothing downstream would catch it:
# there is no headless iOS build to boot and grep for the dictionary.
#
# `application/min_ios_version` is 14.0 because that is what the 4.7 export
# templates are built against; setting it lower does not make them run lower.
# Signing is left off entirely — see ios/README.md.

[preset.2]

name="iOS"
platform="iOS"
runnable=false
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="data/*.txt"
exclude_filter=""
export_path="build/ios/WordWars.ipa"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.2.options]

application/app_store_team_id=""
application/bundle_identifier="com.damonj.wordwars"
application/signature=""
application/short_version=""
application/version=""
application/min_ios_version="14.0"
application/targeted_device_family=1
application/icon_interpolation=4
application/export_project_only=false
capabilities/access_wifi=false
capabilities/push_notifications=false
storyboard/use_custom_bg_color=true
storyboard/custom_bg_color=Color(0.003922, 0.023529, 0.101961, 1)
storyboard/image_scale_mode=0
