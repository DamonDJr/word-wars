; macOS. Unlike iOS, Godot ships a finished universal binary here rather than an
; Xcode project — so no Xcode, no SDK, and this exports straight from Linux.
;
; The x86_64 slice of the 4.7 template reports a minimum of macOS 10.13, so Big
; Sur is comfortably inside it. Left unsigned: `codesign` is a macOS tool and
; there is none here. See packaging/README-macos.txt for the Gatekeeper dance
; that unsigned then requires.

[preset.2]

name="macOS"
platform="macOS"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="data/*.txt"
exclude_filter=""
export_path="build/macos/WordWars.zip"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.2.options]

binary_format/architecture="universal"
application/icon=""
application/icon_interpolation=4
application/bundle_identifier="com.damonj.wordwars"
application/signature=""
application/app_category="Games"
application/short_version=""
application/version=""
application/copyright=""
application/min_macos_version_x86_64="10.13"
application/min_macos_version_arm64="11.00"
display/high_res=true
xcode/platform_build="14C18"
xcode/sdk_version="13.1"
xcode/sdk_build="22C55"
