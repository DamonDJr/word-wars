# Builds an unsigned WordWars.ipa on a macOS runner.
#
# This exists because the Mac in the room runs Big Sur, whose newest Xcode is
# 13.2.1 (iOS 15.2 SDK) — and Godot 4.7's iOS export templates are compiled
# against the iOS 26.1 SDK. That is a five-generation gap and it is not a
# configuration problem; the toolchain simply is not there. A hosted runner has
# a current Xcode, so nothing local has to compile anything.
#
# Unsigned on purpose, exactly like Kinetica and LegendFood: a free Apple ID
# cannot be issued a profile for a device Xcode has never registered. Whatever
# installs the IPA signs it and registers the device — `xtool install` from
# Linux, or Sideloadly on the Big Sur Mac. Signing here would only be thrown
# away by both.
#
# Run it from the Actions tab. The IPA comes out as a build artifact.
name: iOS

on:
  workflow_dispatch:
    inputs:
      godot:
        description: Godot version
        default: "4.7"

jobs:
  ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode on the runner
        run: |
          # The templates want a recent SDK; whatever is newest here will do,
          # and pinning a version would rot the moment the image is updated.
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install Godot and its export templates
        env:
          V: ${{ inputs.godot }}
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${V}-stable"
          curl -fL -o godot.zip "${base}/Godot_v${V}-stable_macos.universal.zip"
          curl -fL -o templates.zip "${base}/Godot_v${V}-stable_export_templates.tpz"
          unzip -q godot.zip
          mkdir -p "$HOME/Library/Application Support/Godot/export_templates"
          unzip -q templates.zip
          mv templates "$HOME/Library/Application Support/Godot/export_templates/${V}.stable"
          echo "GODOT=$PWD/Godot.app/Contents/MacOS/Godot" >> "$GITHUB_ENV"

      - name: Disable EOS native extension for iOS
        run: |
          python3 - <<'PY'
          from pathlib import Path
      
          p = Path("addons/epic-online-services-godot/eosg.gdextension")
          s = p.read_text()
      
          lines = [
              line for line in s.splitlines()
              if not line.startswith("ios.debug =")
              and not line.startswith("ios.release =")
          ]
      
          p.write_text("\n".join(lines) + "\n")
          PY
      

      - name: Import the project
        run: |
          # Two passes. A cold import does not always finish resolving every
          # dependency in one go, and an incomplete import exports a game with
          # missing resources rather than failing loudly.
          "$GODOT" --headless --import . || true
          "$GODOT" --headless --import .

      - name: Export the Xcode project
        run: |
          set -euo pipefail
          mkdir -p build/ios
          # The preset sets export_project_only, so this writes the Xcode
          # project into build/ios and stops. The .ipa path is only how Godot
          # is told where to put things; no .ipa is produced by this step.
          "$GODOT" --headless --export-release "iOS" build/ios/WordWars.ipa
          find build/ios -maxdepth 2 -name "*.xcodeproj" -print

          # The word lists are plain .txt rather than imported resources, so
          # they reach the game only through the preset's include_filter. Lose
          # it and the app starts with an empty dictionary and rejects every
          # word — no crash, no error, and half an hour of runner time before
          # anyone finds out. The pck is right here, so look now.
          for f in data/words.txt data/common.txt; do
            grep -aq "$f" build/ios/WordWars.pck || {
              echo "::error::$f is not in the pck — check include_filter in the iOS preset"
              exit 1
            }
          done
          
      - name: Install Apple signing credentials
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail

          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          PP_PATH="$RUNNER_TEMP/build_pp.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > "$PP_PATH"

          security create-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security set-keychain-settings \
            -lut 21600 \
            "$KEYCHAIN_PATH"

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" \
            -P "$P12_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security list-keychain \
            -d user \
            -s "$KEYCHAIN_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"

          cp "$PP_PATH" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/"

      - name: Build signed App Store app
        run: |
          set -euo pipefail

          proj="$(find build/ios -maxdepth 2 -name '*.xcodeproj' | head -1)"
          scheme="$(basename "$proj" .xcodeproj)"

          echo "Project: $proj"
          echo "Scheme: $scheme"

          xcodebuild \
            -project "$proj" \
            -scheme "$scheme" \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/dd \
            DEVELOPMENT_TEAM="226Y8RZFKG" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="Word Wars App Store Distribution" \
            archive \
            -archivePath build/WordWars.xcarchive
            
      - name: Export App Store IPA
        run: |
          set -euo pipefail

          cat > build/exportOptions.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>

              <key>teamID</key>
              <string>226Y8RZFKG</string>

              <key>signingStyle</key>
              <string>manual</string>

              <key>signingCertificate</key>
              <string>Apple Distribution</string>

              <key>provisioningProfiles</key>
              <dict>
                  <key>com.damonj.wordwars</key>
                  <string>Word Wars App Store Distribution</string>
              </dict>

              <key>compileBitcode</key>
              <false/>
          </dict>
          </plist>
          PLIST

          xcodebuild \
            -exportArchive \
            -archivePath build/WordWars.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist build/exportOptions.plist

          cp build/export/*.ipa WordWars.ipa

          ls -lh WordWars.ipa
      - name: Check Game Center entitlement
        run: |
            set -euo pipefail

            rm -rf verify
            mkdir verify
            unzip -q WordWars.ipa -d verify

            APP="$(find verify/Payload -maxdepth 1 -name "*.app" | head -1)"

            echo "=== Signed App Entitlements ==="
            codesign -d --entitlements :- "$APP" 2>&1

            echo "=== Provisioning Profile Entitlements ==="
            security cms -D \
            -i "$APP/embedded.mobileprovision" \
            > verify/profile.plist

            /usr/libexec/PlistBuddy \
            -c 'Print :Entitlements' \
            verify/profile.plist
      - name: Verify signed IPA
        run: |
          set -euo pipefail

          rm -rf verify
          mkdir verify

          unzip -q WordWars.ipa -d verify

          app="$(find verify/Payload -maxdepth 1 -name '*.app' | head -1)"

          echo "App: $app"

          echo "=== Bundle ID ==="
          /usr/libexec/PlistBuddy \
            -c 'Print :CFBundleIdentifier' \
            "$app/Info.plist"

          echo "=== Device Families ==="
          /usr/libexec/PlistBuddy \
            -c 'Print :UIDeviceFamily' \
            "$app/Info.plist"

          echo "=== Code Signature ==="
          codesign -dvv "$app" 2>&1 | head -30

          echo "=== Provisioning Profile ==="
          security cms -D \
            -i "$app/embedded.mobileprovision" \
            > verify/profile.plist

          /usr/libexec/PlistBuddy \
            -c 'Print :Name' \
            verify/profile.plist

          /usr/libexec/PlistBuddy \
            -c 'Print :Entitlements:application-identifier' \
            verify/profile.plist

      - uses: actions/upload-artifact@v4
        with:
          name: WordWars-ios-app-store
          path: WordWars.ipa
